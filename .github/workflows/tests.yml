name: Tests

on:
  push:
    branches:
      - version-16
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-ttpl-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  FRAPPE_BRANCH: version-16
  ERPNEXT_BRANCH: version-16

jobs:
  backend-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=15

      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -fq "${GITHUB_WORKSPACE}/ttpl"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"; then
            echo "::error::Found merge conflicts"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcups2-dev mariadb-client

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Configure MariaDB
        run: |
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Init bench
        run: |
          pip install frappe-bench
          bench init \
            --skip-redis-config-generation \
            --skip-assets \
            --frappe-branch "${FRAPPE_BRANCH}" \
            --python "$(which python)" \
            ~/frappe-bench

      - name: Configure bench
        working-directory: /home/runner/frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache "redis://127.0.0.1:13000"
          bench set-config -g redis_queue "redis://127.0.0.1:11000"
          bench set-config -g redis_socketio "redis://127.0.0.1:11000"

      - name: Install apps
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench get-app erpnext --branch "${ERPNEXT_BRANCH}" --resolve-deps
          bench get-app ttpl "${GITHUB_WORKSPACE}"
          bench setup requirements --dev
          bench new-site \
            --db-root-password root \
            --admin-password admin \
            --install-app erpnext \
            --install-app ttpl \
            test_site
          bench build --app ttpl

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        env:
          TYPE: server
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app ttpl

      - name: Show bench output on failure
        if: failure()
        working-directory: /home/runner/frappe-bench
        run: |
          cat logs/*.log 2>/dev/null || true
