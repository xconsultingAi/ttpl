name: Linters

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: linters-ttpl-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # Backend linters (Python)
  # -------------------------------------------------------------------
  backend-linters:
    name: Backend Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install and Run Pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: no-commit-to-branch

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Download semgrep
        run: pip install semgrep

      # ttpl/override/payment_entry.py is a verbatim fork of ERPNext's controller and is
      # kept diffable against upstream, so it is excluded from the rule scan.
      - name: Run Semgrep rules
        run: |
          semgrep ci \
            --config ./frappe-semgrep-rules/rules \
            --config r/python.lang.correctness \
            --exclude "ttpl/override/payment_entry.py" \
            --exclude-rule "frappe-semgrep-rules.rules.security.missing-argument-type-hint"
